estateStrip:
  eyebrow: "A Heritage Country Estate · The Wairarapa"
  lead: "An English country house set in vast park-like grounds. Longwood is a rare and romantic setting for weddings, celebrations and private gatherings."

introStrip:
  eyebrow: "Welcome to Longwood"
  lead: "Reputedly New Zealand’s largest private home, Longwood welcomes you in the finest English country-house tradition — grand rooms, open fires and gracious hospitality, wrapped in gardens a century in the making."

house:
  kicker: "The House"
  heading: "One of the country’s grandest homes"
  paragraphs:
    - "Longwood, named after Napoleon’s house of exile on St Helena, was taken up as a sheep station in the 1850's by Henry Bunny who built a small house on the property and established the gardens. In 1906 it burned down and was replaced with a brick house designed by John Swan. This house was subsequently remodelled by William Gray Young in 1921. The style is English-asymmetrical in the manner of Lutyens, with a gracious neo-Georgian interior of grand staircases, ornate ceilings, Adam fireplaces and fine wood panelling."
    - "Four large ensuite bedrooms wait upstairs with canopied beds, antique furnishings and open fires. Four more bedrooms are available for larger groups or small conferences. Savour dinner in the glorious dining room, relax in the library, or view the stars from the balcony or loggia."
  stats:
    - { value: "8+", label: "Bedrooms" }
    - { value: "1850's", label: "Built" }
    - { value: "Grade 1", label: "Heritage NZ" }
  tiles:
    - { tileClass: "tile tile--col-1-span-2", src: "front-elevation.jpg", alt: "Longwood — front elevation" }
    - { tileClass: "tile", src: "dining-room.jpg", alt: "The dining room", lazy: true }
    - { tileClass: "tile", src: "canopied-bedroom.jpg", alt: "A canopied bedroom", lazy: true, focal: 62 }

grounds:
  kicker: "The Grounds"
  heading: "Vast lawns, venerable trees, quiet corners"
  paragraph: "Wander park-like grounds shaded by venerable English trees, retire to the Sunken Garden with a book, or take to the lawn for tennis, croquet and boules. A swimming pool, tennis court and the estate’s historic stables sit among grounds and outbuildings that carry Heritage New Zealand’s highest status."
  features:
    - "Sunken Garden"
    - "Tennis & croquet lawn"
    - "Swimming pool"
    - "Historic stables & courtyard"
  tiles:
    - { tileClass: "tile tile--col-1-span-2", src: "park-grounds.jpg", alt: "Park-like grounds", lazy: true, focal: 75 }
    - { tileClass: "tile", src: "sunken-garden.jpg", alt: "The Sunken Garden", lazy: true }
    - { tileClass: "tile", src: "lawns-aerial.jpg", alt: "Lawns & English trees", lazy: true }

weddings:
  kicker: "Weddings & Functions"
  heading: "A setting made for celebrations"
  lead: "Exchange vows on the lawn beneath century-old trees, dine under ornate ceilings, and host your guests across the estate’s rooms. Every gathering at Longwood is arranged with care and a little old-world grace."
  cards:
    - { title: "Garden ceremonies", text: "Lawn and marquee ceremonies among the gardens and heritage trees." }
    - { title: "Receptions & dining", text: "Private dinners in the dining room, library and loggia." }
    - { title: "Stay the weekend", text: "On-site accommodation for your closest guests in the house." }
    - { title: "Bespoke, by arrangement", text: "Functions, retreats and private occasions, tailored to you." }
  cta: { href: "#enquire", label: "Enquire about your day" }
  ctaNote: "Tariffs available on request"

conferences:
  kicker: "Meetings & Retreats"
  heading: "A considered setting for small conferences"
  paragraphs:
    - "Trade the boardroom for a heritage country house an hour from Wellington. Longwood lends itself to board meetings, strategy days and creative retreats — the panelled rooms make for focused sessions, while the gardens, loggia and open fires draw people together."
    - "Take the estate exclusively for the day or stay the night: with on-site accommodation, wholesome and creative catering and Martinborough’s wineries at the gate, a small conference here feels a world away from the office."
  features:
    - "Boardroom & breakout rooms"
    - "Whole-estate exclusive use"
    - "On-site accommodation"
    - "Catering & garden breaks"
  tile: { tileClass: "tile tile--h-conf", src: "meeting-room.jpg", alt: "The panelled room set for a meeting", lazy: true }
  cta: { href: "#enquire", label: "Enquire about a retreat" }

region:
  kicker: "The Region"
  heading: "The heart of the South Wairarapa"
  paragraph: "Longwood lies a little over an hour from Wellington and minutes from Martinborough and Greytown. Martinborough is 15 minutes, Greytown is 8 minutes. The South Wairarapa is a region renowned for world-class Pinot Noir, boutique wineries, gourmet food, excellent shopping and a vibrant arts scene. Beyond the vines are wild coastlines, the Putangirua Pinnacles and the Cape Palliser seal colony."
  stats:
    - { value: "1 hr", label: "From Wellington" }
    - { value: "15 min", label: "To Martinborough" }
    - { value: "20+", label: "Boutique wineries" }
    - { value: "Coast", label: "Pinnacles & seals" }

