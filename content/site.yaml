stories:
  kicker: "Stories"
  heading: "Stories at Longwood"
  paragraph: "History, romance, and creativity come together at Longwood, making it an exceptional setting for love stories, weddings, film and photography shoots, and memorable cultural events. Longwood offers an authentic backdrop that inspires lovers, storytellers, and visitors."
  stories:
    - { heading: "Filming ‘Time Bandits’", content: "Longwood was the perfect location for Apple TV+ fantasty series. The Taika Waititi, Iain Morris and Jemaine Clement production filmed multiple scenes at the stately home.", link: "https://www.thepost.co.nz/nz-news/350346185/stately-featherston-home-welcomes-time-bandits", linktext: "See more: Stately Featherston home welcomes Time Bandits" }
    - { heading: "Fleur and Hamish - a love story", content: "Hamish popped the question while the couple were on holiday in the Wairarapa, so it was fitting they returned to the region for their wedding day.", link: "https://weddingswairarapa.co.nz/wairarapa-wedding-blog/classic-romance-wedding-wairarapa", linktext: "See more: Classic romance in the Wairarapa" }
    - { heading: "Picture perfect", content: "Wedding, lifestyle and commercial photographer David Le says the Wairarapa turned it on for his collaborative photoshoot at Longwood Estate. ", link: "https://davidle.co.nz/blog/davidlesonyscenenzlongwood-rose-and-smith", linktext: "See more: SONY NZ Styled Shoot Wairapapa Longwood x Rose & Smith" }
    - { heading: "Hosting Featherston Booktown authors", content: "Activist, advocate and writer Denis O’Reilly stayed at Longwood during Booktown. He spent an uplifting weekend in the small provincial town of Featherston.", link: "https://e-tangata.co.nz/reflections/reason-to-feel-hopeful-about-aotearoa/", linktext: "See more: Reason to feel hopeful about Aotearoa" }
    - { heading: "Memories of a creative childhood", content: "'I think I'm gonna like it here!' - Writer Francesca Emms reflects on growning up at Longwood, her magical, beautiful, historical home.", link: "https://issuu.com/capitalmag/docs/capital_51/60", linktext: "See more: Room to Grown, Capital Magazine" }
    - { heading: "The history of Longwood", content: "The Homestead has significant architectural merit, designed by Wellington architect John Swan before being modified to a Lutyens-inspired design by noted architect William Gray Young. ", link: "https://www.heritage.org.nz/list-details/7696/Longwood", linktext: "Read more: Historic Place Category 1, Heritage, NZ" }

